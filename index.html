        },
        {

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Os planos começam em R$69/mês (Plus), passam por R$149/mês (Pro) e chegam a R$297/mês (Enterprise). Todos com 7 dias grátis sem cartão de crédito."
          }
        },
        {
          "@type": "Question",
          "name": "O Hub Empresarial tem inteligência artificial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Hub conta com o Hub Assistant (assistente conversacional com tool calling), classificação automática de clientes por IA, onboarding guiado por IA e templates de operação aplicados automaticamente conforme o nicho do usuário."

        },
        {
          "@type": "Question",
