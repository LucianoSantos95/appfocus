    <!-- JSON-LD: FAQPage (alto valor para SEO e GEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é o Hub Empresarial Focus?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Hub Empresarial Focus é um sistema de gestão integrado em português para agências, consultorias, freelancers e PMEs. Reúne em uma única plataforma módulos de Finanças, Clientes (CRM), Projetos, Tarefas, Marketing, RH e Processos, com assistente de IA e dashboards de BI. Disponível em app.focusinteligente.com.br."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto custa o Hub Empresarial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Hub Empresarial oferece plano gratuito e 3 planos pagos: Plus (R$69/mês), Pro (R$149/mês com relatórios avançados e automações) e Enterprise (R$297/mês com equipes e integrações avançadas)."
          }
        },
        {
          "@type": "Question",
          "name": "O Hub Empresarial tem versão gratuita?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Hub Empresarial possui plano gratuito com acesso aos módulos essenciais de gestão. Recursos avançados como relatórios automáticos, BI completo e automações por IA estão disponíveis nos planos pagos a partir de R$69/mês."
          }
        },
        {
          "@type": "Question",
          "name": "Para quem é o Hub Empresarial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Hub Empresarial foi criado para agências de marketing digital, consultorias, freelancers que querem operar como empresa e pequenas e médias empresas brasileiras que precisam substituir planilhas e ferramentas fragmentadas por uma plataforma única de gestão."
          }
        },
        {
          "@type": "Question",
          "name": "O Hub Empresarial substitui quais ferramentas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Hub Empresarial substitui planilhas Excel e Google Sheets, Trello ou Asana para projetos, CRMs separados como Pipedrive, sistemas de controle financeiro isolados e ferramentas de RH. Tudo em uma única plataforma integrada com inteligência artificial."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o onboarding do Hub Empresarial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O onboarding é personalizado por segmento. O sistema identifica se você é agência, consultoria, freelancer ou PME e pré-configura templates de pipeline, tarefas, categorias financeiras e projetos prontos para seu tipo de operação. Em menos de 5 minutos você já tem dados reais para trabalhar."
          }
        }
      ]
    }
