  <body>
    <div id="root"></div>
    <script>
      // Aplica o tema salvo antes do React montar: evita piscar claro/escuro
      // e tira a divergência de tema entre o HTML pré-gerado e o navegador.
      (function () {
        try {
          var t = localStorage.getItem("hub-theme") === "light" ? "light" : "dark";
          var r = document.documentElement;
          r.classList.remove("light", "dark");
          r.classList.add(t);
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
