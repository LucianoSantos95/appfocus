    <meta name="description" content="Hub Empresarial da Focus Inteligente é o sistema de gestão integrado 100% em português para agências de marketing, consultorias, freelancers e pequenas empresas. Substitua planilhas, Trello e ferramentas fragmentadas por uma plataforma única com módulos de Finanças (controle de receitas, despesas, fluxo de caixa e importação de extratos OFX), Clientes e CRM (prospectos, clientes ativos, classificação por IA e anotações de reuniões), Projetos (prazos, orçamentos, responsáveis e anexos), Tarefas (Kanban com prioridades e notificações), Marketing (campanhas, funil de vendas e calendário de conteúdo), Recursos Humanos (colaboradores, vagas, documentos e timeline) e Processos (documentação estruturada e exportável). Conta com onboarding guiado por IA, templates pré-configurados por nicho (agência, consultoria, freelancer, PME), Hub Assistant com tool calling em todos os módulos, dashboards de BI com relatórios automáticos para clientes em PDF, e-mail ou WhatsApp, e integrações com Google Workspace, Stripe e WhatsApp via Twilio. Planos a partir de R$69/mês com 7 dias de teste grátis. Sem cartão de crédito. Cancele quando quiser.">
